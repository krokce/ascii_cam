# SD card layout: boot (FAT, firmware and kernel), rootfs (ext4,
# mounted read-only) and REC (FAT32, read-write, recordings and settings).
image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_x.elf",
			"rpi-firmware/fixup_x.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"bcm2708-rpi-zero-w.dtb",
			"zImage"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rec {
		partition-type = 0xC
		image = "rec.vfat"
	}
}
